name: Build DanzKu PQ Global Hook

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
      - name: Install NDK
        run: sdkmanager "ndk;27.2.12479018"
      - name: Build
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          "$ANDROID_NDK_HOME/ndk-build" NDK_PROJECT_PATH=. NDK_APPLICATION_MK=Application.mk
      - name: Package
        run: |
          mkdir -p package/system/lib64 package/system/bin
          cp libs/arm64-v8a/libdanzku_pq.so package/system/lib64/
          cp libs/arm64-v8a/danzku-pq-injector package/system/bin/
          cp module.prop service.sh package/
          chmod 755 package/service.sh package/system/bin/danzku-pq-injector
          cd package && zip -r ../DanzKu-PQ-Global-Hook-v0.2.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: DanzKu-PQ-Global-Hook-v0.2
          path: DanzKu-PQ-Global-Hook-v0.2.zip
